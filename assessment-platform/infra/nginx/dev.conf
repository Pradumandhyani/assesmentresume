map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream student_app { server host.docker.internal:3000; }
upstream admin_app { server host.docker.internal:3001; }
upstream assessment_api { server host.docker.internal:4000; }
server {
  listen 8080;
  client_max_body_size 128k;
  location /api/ { proxy_pass http://assessment_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://student_app; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
}
server {
  listen 8081;
  client_max_body_size 128k;
  location /api/v1/admin/questions/ { client_max_body_size 8m; proxy_pass http://assessment_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ { proxy_pass http://assessment_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://admin_app; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
}
