# Private monitoring subnet only. Configure TLS/auth for remote exporters rather
# than exposing DB, queue, host or process metrics to browsers.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: judge-node
    static_configs:
      - targets: ['judge-node-exporter:9100']
  - job_name: application-container
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: https-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://students.example.invalid/api/v1/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
