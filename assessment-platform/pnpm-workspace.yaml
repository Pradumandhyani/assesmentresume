packages:
  - frontend
  - backend
  - admin

# Targeted fixes for audited upstream transitive dependencies; keep validated with Prisma/Swagger.
overrides:
  '@prisma/config>deepmerge-ts': 8.0.0
  'prisma>mysql2': 3.23.1
  '@nestjs/swagger>js-yaml': 5.4.1
  'monaco-editor>dompurify': 3.4.17
  'express>body-parser': 2.4.0
  '@nestjs/platform-express>multer': 2.5.0
  'ajv>fast-uri': 3.1.9
  '@istanbuljs/load-nyc-config>js-yaml': 4.3.2

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

# Explicit install-time lifecycle allowlist. Judge code never runs during installation.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - argon2
  - esbuild
  - sharp
  - '@tailwindcss/oxide'

# Optional native accelerators and telemetry are unnecessary for this scaffold.
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - msgpackr-extract
  - prisma
